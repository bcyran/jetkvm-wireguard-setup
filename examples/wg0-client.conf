# WireGuard Client Configuration for JetKVM
#
# IMPORTANT: This config is for use with the 'wg' command, NOT 'wg-quick'!
# The JetKVM does not have wg-quick (requires bash), so do NOT include:
# - Interface.Address (this is set via 'ip address add' by the install script)
# - Interface.DNS
# - Interface.PostUp/PostDown
# - Interface.Table
#
# These directives are wg-quick specific and will cause errors with 'wg setconf'.
#
# SETUP INSTRUCTIONS:
# 1. Generate client keys:
#    wg genkey | tee client-private.key | wg pubkey > client-public.key
#
# 2. Get the server's public key (from server administrator)
#
# 3. Replace the placeholder values below
#
# 4. Set WIREGUARD_IP in .env to match the IP assigned by the server

[Interface]
# Client's private key
PrivateKey = CLIENT_PRIVATE_KEY_REPLACE_ME

# Server Configuration
[Peer]
# Server's public key
PublicKey = SERVER_PUBLIC_KEY_REPLACE_ME

# Server's endpoint (IP or hostname and port)
Endpoint = SERVER_IP_OR_HOSTNAME:51820

# What IP ranges to route through the VPN
AllowedIPs = 192.168.2.0/24

# Keep connection alive (important for NAT traversal)
# Sends keepalive packet every 25 seconds
PersistentKeepalive = 25
