# WireGuard Server Configuration for JetKVM
#
# IMPORTANT: This config is for use with the 'wg' command, NOT 'wg-quick'!
# The JetKVM does not have wg-quick (requires bash), so do NOT include:
# - Interface.Address (this is set via 'ip address add' by the install script)
# - Interface.DNS
# - Interface.PostUp/PostDown
# - Interface.Table
#
# These directives are wg-quick specific and will cause errors with 'wg setconf'.
#
# SETUP INSTRUCTIONS:
# 1. Generate server keys:
#    wg genkey | tee server-private.key | wg pubkey > server-public.key
#
# 2. Generate client keys (for each peer):
#    wg genkey | tee client-private.key | wg pubkey > client-public.key
#
# 3. Replace the placeholder keys below with your actual keys
#
# 4. Set WIREGUARD_IP in .env to match your desired server IP (e.g., 192.168.2.1/24)

[Interface]
# Server's private key
PrivateKey = SERVER_PRIVATE_KEY_REPLACE_ME

# Port to listen on (standard WireGuard port)
ListenPort = 51820

# Single Peer Configuration
[Peer]
# Client's public key
PublicKey = CLIENT_PUBLIC_KEY_REPLACE_ME

# IP addresses this peer is allowed to use
# For a single client, this would be their VPN IP
AllowedIPs = 192.168.2.2/32

# Optional: Uncomment to allow the peer to roam between IP addresses
# PersistentKeepalive = 25

# Additional Peers (copy this block for each additional client):
#[Peer]
#PublicKey = ANOTHER_CLIENT_PUBLIC_KEY
#AllowedIPs = 192.168.2.3/32
